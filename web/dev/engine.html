<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naqsha engine dev</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0f11; font: 12px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; color: #e8e6e1; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #ui { position: fixed; top: 10px; left: 10px; width: 300px; max-height: calc(100% - 20px); overflow: auto; background: rgba(18, 19, 22, 0.86); border: 1px solid #2c2e33; border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); }
      #ui h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: 0.02em; }
      #ui .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
      #ui button, #ui select { background: #24262b; color: #e8e6e1; border: 1px solid #3a3d44; border-radius: 6px; padding: 4px 7px; font: inherit; cursor: pointer; }
      #ui button.on { background: #c9a46a; color: #111; border-color: #c9a46a; }
      #ui label { display: flex; align-items: center; gap: 6px; }
      #stats { font-variant-numeric: tabular-nums; color: #b9b6ae; white-space: pre-wrap; }
      #sections { margin-top: 6px; font-variant-numeric: tabular-nums; }
      #sections div { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; border-bottom: 1px dotted #2c2e33; }
      #sections .err { color: #ff8a7a; }
      #sections .msg { color: #ff8a7a; font-size: 11px; display: block; }
      #ui.min > *:not(h1) { display: none; }
      #checks { position: fixed; top: 10px; right: 10px; width: 360px; max-height: calc(100% - 20px); overflow: auto; background: rgba(18, 19, 22, 0.9); border: 1px solid #2c2e33; border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); }
      #checks h2 { font-size: 13px; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; }
      #checks h2 small { color: #8d8a83; font-weight: 400; }
      #checks .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 8px; }
      #checks button { background: #24262b; color: #e8e6e1; border: 1px solid #3a3d44; border-radius: 6px; padding: 4px 7px; font: inherit; cursor: pointer; }
      #checks button.on { background: #c9a46a; color: #111; border-color: #c9a46a; }
      #checks .chk { display: grid; grid-template-columns: 14px 1fr; gap: 2px 8px; padding: 6px 0; border-top: 1px solid #2a2c31; }
      #checks .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; }
      #checks .pass .dot { background: #46b37a; }
      #checks .warn .dot { background: #e0a83a; }
      #checks .fail .dot { background: #e5584f; }
      #checks .t { font-weight: 600; }
      #checks .d { grid-column: 2; color: #b9b6ae; font-size: 11px; }
      #checks.min > *:not(h2) { display: none; }
      #plan { position: fixed; top: 10px; left: 320px; width: calc(100% - 700px); height: calc(100% - 20px); border-radius: 10px; display: none; box-shadow: 0 8px 30px rgba(0,0,0,0.35); }
      #plan.on { display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui">
      <h1>Naqsha engine <span id="toggle" style="float:right;cursor:pointer;color:#888">–</span></h1>
      <div class="row">
        <select id="design">
          <option value="fixture">10-marla · design-10-marla.js</option>
          <option value="fixture-default">10-marla · defaultDesign()</option>
          <option value="argon">argon-v1 · Argon design.js</option>
          <option value="argon-default">argon-v1 · defaultDesign()</option>
          <option value="kanal">1-kanal (live) · Argon design.js</option>
          <option value="kanal-default">1-kanal (live) · defaultDesign()</option>
          <option value="kanal-solar">1-kanal · solar panels + RCC tank</option>
          <option value="argon-solar">argon-v1 · solar panels + plastic tank</option>
          <option value="kanal-gable">1-kanal · gable roof, ridge along the road, detached street</option>
          <option value="kanal-gable-side">1-kanal · gable facing the road</option>
          <option value="kanal-hip">1-kanal · hip roof</option>
          <option value="row-gable">argon-v1 · row house with a gable roof</option>
          <option value="kanal-gable-solar">1-kanal · gable roof with flush solar panels</option>
          <option value="argon-semi">argon-v1 · semi-detached street</option>
        </select>
        <select id="quality"><option value="high">high</option><option value="medium">medium</option></select>
        <button id="rebuild">Rebuild</button>
      </div>
      <div class="row" id="views">
        <button data-view="front">Front</button>
        <button data-view="aerial">Aerial ¾</button>
        <button data-view="dollhouse">Dollhouse</button>
        <button data-view="lounge">Lounge</button>
        <button data-view="master">Master bed</button>
        <button data-view="back">Rear</button>
      </div>
      <div class="row" id="levels"></div>
      <div class="row">
        <label>Sun <input id="hour" type="range" min="6" max="19.5" step="0.25" value="17.5" /> <span id="hourv">17.5</span></label>
        <label><input id="post" type="checkbox" checked /> AO+SMAA</label>
      </div>
      <div id="stats">building…</div>
      <div id="sections"></div>
    </div>
    <canvas id="plan"></canvas>
    <div id="checks">
      <h2>Livability checks <span><small id="chkSum"></small> <span id="chkToggle" style="cursor:pointer;color:#888">–</span></span></h2>
      <div class="row"><button id="runChecks">Run checks</button><span id="planBtns"></span></div>
      <div id="chkList"><div class="d">building…</div></div>
    </div>
    <script type="module" src="/src/engine/dev/main.ts"></script>
  </body>
</html>
